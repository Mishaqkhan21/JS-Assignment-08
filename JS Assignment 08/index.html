<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JS Assignment 08</title>
<style>

body {
  font-family: Arial, sans-serif;
  background: linear-gradient(135deg, #6C63FF, #4A90E2);
  min-height: 100vh;
  margin: 0;
  display: flex;
  justify-content: center;
  padding-top: 60px;
}

.container {
  background: white;
  width: 90%;
  max-width: 420px;
  border-radius: 12px;
  box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
  padding: 30px;
  height: fit-content;
}

h1 {
  text-align: center;
  color: #333;
  margin-top: 0;
}

.input-row {
  display: flex;
  gap: 10px;
  margin-bottom: 20px;
}

#taskInput {
  flex: 1;
  padding: 10px;
  font-size: 16px;
  border: 2px solid #ddd;
  border-radius: 6px;
  outline: none;
}

#addBtn {
  padding: 10px 16px;
  font-size: 16px;
  background: #6C63FF;
  color: white;
  border: none;
  border-radius: 6px;
  cursor: pointer;
}

ul {
  list-style: none;
  padding: 0;
  margin: 0;
}

li {
  display: flex;
  align-items: center;
  background: #f7f7fb;
  padding: 12px;
  border-radius: 6px;
  margin-bottom: 10px;
}

li span {
  flex: 1;
  margin-left: 10px;
  font-size: 16px;
  color: #333;
}

.completed-text {
  text-decoration: line-through;
  color: #aaa;
}

.delete-btn {
  background: #ff5c5c;
  color: white;
  border: none;
  border-radius: 6px;
  padding: 6px 10px;
  cursor: pointer;
}

</style>
</head>
<body>

  <div class="container">
    <h1>My Todo List</h1>

    <div class="input-row">
      <input type="text" id="taskInput" placeholder="Add a new task...">
      <button id="addBtn" onclick="addTask()">Add</button>
    </div>

    <ul id="taskList"></ul>
  </div>
  <script src="./app.js"></script>

</body>
</html>
