<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JS Assignment 08</title>

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #6c63ff, #4a90e2);
            min-height: 100vh;
            margin: 0;
            padding-top: 60px;
        }

        .container {
            width: 90%;
            max-width: 420px;
            margin: auto;
            padding: 25px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 10px 25px #0003;
        }

        h1 {
            text-align: center;
            color: #333;
        }

        .input-row,
        .buttons {
            display: flex;
            gap: 8px;
        }

        input {
            width: 100%;
            padding: 10px;
            border: 2px solid #ddd;
            border-radius: 6px;
            outline: none;
        }

        .input-row input {
            flex: 1;
        }

        button {
            padding: 10px 14px;
            border: 0;
            border-radius: 6px;
            background: #6c63ff;
            color: white;
            cursor: pointer;
        }

        #searchInput {
            margin: 15px 0;
        }

        ul {
            list-style: none;
            padding: 0;
        }

        li {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 12px;
            margin-bottom: 10px;
            background: #f7f7fb;
            border-radius: 6px;
        }

        .task-text {
            flex: 1;
            cursor: pointer;
        }

        .done {
            text-decoration: line-through;
            color: #aaa;
        }

        .edit {
            background: #4a90e2;
        }

        .delete {
            background: #ff5c5c;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>Todo App</h1>

        <div class="input-row">
            <input id="taskInput" placeholder="Add a new task">
            <button id="addBtn">Add</button>
        </div>

        <input id="searchInput" placeholder="Search task...">

        <ul id="taskList"></ul>

    </div>

    <script src="./app.js"></script>

</body>
</html>
